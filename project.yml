name: Levels
options:
  bundleIdPrefix: com.joseluna
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.2"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: true
    ENABLE_DEBUG_DYLIB: false
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Levels:
    type: application
    dependencies:
      - package: Sparkle
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Fader-LICENSE.txt
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.joseluna.levels
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Levels.entitlements
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false
  LevelsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Sources/PopoverCloseTransition.swift
      - Sources/UpdateConfiguration.swift
      - Sources/Audio/AudioTapLifecycle.swift
      - Sources/Audio/VolumeStore.swift
      - Sources/Audio/DeviceUsageStore.swift
      - Sources/Audio/DevicePriorityStore.swift
      - Sources/Audio/JSONDefaults.swift
      - Sources/Audio/DeviceSymbol.swift
      - Sources/Audio/AudioDevice.swift
      - Sources/Audio/AudioApp.swift
      - Sources/Audio/DevicePriorityPolicy.swift
      - Sources/Audio/MultiOutputPolicy.swift
      - Sources/Audio/VolumeTaper.swift
      - Sources/Audio/TapMix.swift
      - Sources/Audio/HALProperty.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
schemes:
  Levels:
    build:
      targets:
        Levels: all
    test:
      targets: [LevelsTests]
